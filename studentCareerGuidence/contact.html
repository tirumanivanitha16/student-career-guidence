<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us - StudentCareerGuide</title>
    <link rel="stylesheet" href="css/style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <nav>
        <div class="logo">
          <h1>StudentCareerGuide</h1>
        </div>
        <div class="menu">
          <a href="index.html">Home</a>
          <a href="about.html">About</a>
          <a href="careers.html">Careers</a>
          <a href="courses.html">Courses</a>
          <a href="contact.html">Contact</a>
        </div>
        <div class="button">
          <button
            class="login-btn"
            onclick="window.location.href = 'login.html'"
          >
            Login
          </button>
          <button
            class="register-btn"
            onclick="window.location.href = 'register.html'"
          >
            Register
          </button>
        </div>
      </nav>
    </header>

    <main>
      <section class="about">
        <div class="about-container">
          <h2 class="section-title">Contact Us</h2>
          <p style="text-align: center">
            Have questions? Reach out to us and we will get back to you soon.
          </p>

          <form
            style="
              max-width: 500px;
              margin: 30px auto;
              display: flex;
              flex-direction: column;
              gap: 15px;
            "
          >
            <input
              type="text"
              placeholder="Your Name"
              required
              style="padding: 12px; border-radius: 6px; border: 1px solid #ccc"
            />
            <input
              type="email"
              placeholder="Your Email"
              required
              style="padding: 12px; border-radius: 6px; border: 1px solid #ccc"
            />
            <textarea
              rows="5"
              placeholder="Your Message"
              required
              style="padding: 12px; border-radius: 6px; border: 1px solid #ccc"
            ></textarea>
            <button
              type="submit"
              class="register-btn"
              style="cursor: pointer; padding: 12px"
            >
              Send Message
            </button>
          </form>
        </div>
      </section>
    </main>

    <footer>
      <div class="footer-container">
        <p>&copy; 2026 CareerGuide. All Rights Reserved.</p>
        <div class="footer-links">
          <a href="privacy.html">Privacy Policy</a>
          <a href="terms.html">Terms of Service</a>
          <a href="contact.html">Help Support</a>
        </div>
      </div>
    </footer>
  </body>
</html>
