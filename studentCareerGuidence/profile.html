<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - CareerGuide</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="dashboard-body">

    <aside class="sidebar">
        <div class="sidebar-logo">
            <h2>CareerGuide</h2>
        </div>
        <ul class="sidebar-menu">
            <li><a href="dashboard.html">📊 Dashboard</a></li>
            <li><a href="profile.html" class="active">👤 My Profile</a></li>
            <li><a href="assessment.html">📝 Career Test</a></li>
            <li><a href="index.html">🚪 Logout</a></li>
        </ul>
    </aside>

    <div class="dashboard-main">
        <header class="topbar">
            <div class="welcome-msg">
                <h3>My Profile</h3>
            </div>
        </header>

        <main class="dash-content">
            <div class="profile-card">
                <form action="php/profile_process.php" method="POST">
                    <div class="profile-grid">
                        <div class="form-group">
                            <label>Full Name</label>
                            <input type="text" name="fullname" value="Student Name" required>
                        </div>
                        <div class="form-group">
                            <label>Email Address</label>
                            <input type="email" name="email" value="student@gmail.com" readonly style="background: #eee; cursor: not-allowed;">
                        </div>
                        <div class="form-group">
                            <label>Phone Number</label>
                            <input type="tel" name="phone" placeholder="Enter phone number">
                        </div>
                        <div class="form-group">
                            <label>Current Education Status</label>
                            <select name="education">
                                <option value="10th">Class 10th</option>
                                <option value="inter">Intermediate (12th)</option>
                                <option value="diploma">Diploma</option>
                                <option value="graduation">Under Graduation (B.Tech/B.Sc/B.Com)</option>
                            </select>
                        </div>
                        <div class="form-group" style="grid-column: span 2;">
                            <label>School / College Name</label>
                            <input type="text" name="institution" placeholder="Enter your institution name">
                        </div>
                    </div>
                    <button type="submit" class="profile-save-btn">Save Changes</button>
                </form>
            </div>
        </main>
    </div>

</body>
</html>
